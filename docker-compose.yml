# Docker log size limits (Control 2): each container keeps at most 3 x 10 MB of logs,
# so logs cannot grow until the disk is full.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  ollama:
    image: ollama/ollama:0.40.14
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - webui_net   # Open WebUI <-> Ollama; also gives Ollama internet access to download models
      - agent_net   # ADK agent <-> Ollama
    logging: *default-logging
    restart: unless-stopped

  # HTTPS reverse proxy (Control 6). The only service with host ports, both on 127.0.0.1.
  # Browser -> https://localhost:3443 (TLS) -> proxy -> Open WebUI. See docs/encryption.md.
  proxy:
    image: caddy:2.11.7-alpine@sha256:e70b164da81ef698b3ad19af799ea6086ce6d9e48ed4079eb9fe26f6fbf14ee5
    ports:
      - "127.0.0.1:3443:8443"   # HTTPS
      - "127.0.0.1:3000:8080"   # HTTP, only redirects to HTTPS
    volumes:
      - ./proxy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data        # local CA + certificate private keys
    networks:
      - edge_net    # proxy <-> Open WebUI only; cannot reach Ollama or the ADK agent
    logging: *default-logging
    read_only: true
    tmpfs:
      - /tmp
      - /config
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE   # the caddy binary carries this file capability; it will not start without it
    security_opt:
      - no-new-privileges:true
    depends_on:
      - open-webui
    restart: unless-stopped

  open-webui:
    image: ghcr.io/open-webui/open-webui:v0.12.5
    # No "ports:" — reachable from the browser only through the HTTPS proxy.
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
      # Fails "docker compose up" if .env is missing or the key is empty (Control 6).
      - WEBUI_SECRET_KEY=${WEBUI_SECRET_KEY:?Set WEBUI_SECRET_KEY in .env (see README step 2)}
      - WEBUI_URL=https://localhost:3443
      # Access control (Control 4). These settings come from this file on every start:
      # without ENABLE_PERSISTENT_CONFIG=False, Open WebUI would keep older values from its database.
      - ENABLE_PERSISTENT_CONFIG=False
      - ENABLE_SIGNUP=False                     # no self sign-up; the admin creates accounts
      - DEFAULT_USER_ROLE=pending               # any new account needs admin approval
      - USER_PERMISSIONS_CHAT_FILE_UPLOAD=False  # normal users cannot attach files to chats
      - USER_PERMISSIONS_CHAT_WEB_UPLOAD=False   # ...or pull in web pages as documents
      - USER_PERMISSIONS_WORKSPACE_KNOWLEDGE_ACCESS=False  # ...or create document collections
      - CORS_ALLOW_ORIGIN=https://localhost:3443;https://127.0.0.1:3443  # only our own HTTPS origin
      # Connection to the G-ForceX ADK agent (OpenAI-compatible API, see agent/gforcex_agent/openai_api.py).
      # Normal users only see models the admin shares; only the agent is shared (scripts/openwebui_register_agent.py).
      - ENABLE_OPENAI_API=True
      - OPENAI_API_BASE_URLS=http://adk-agent:8000/v1
      - OPENAI_API_KEYS=${GFORCEX_AGENT_API_KEY:?Set GFORCEX_AGENT_API_KEY in .env (see README step 2)}
      - ENABLE_FORWARD_USER_INFO_HEADERS=True   # the agent audits the user's ID and role (not name or e-mail)
      # Background title/tag/follow-up generation would send extra, unlogged-by-user runs to the agent.
      - ENABLE_TITLE_GENERATION=False
      - ENABLE_TAGS_GENERATION=False
      - ENABLE_FOLLOW_UP_GENERATION=False
    volumes:
      - webui_data:/app/backend/data
    networks:
      - webui_net       # Open WebUI <-> Ollama
      - edge_net        # HTTPS proxy -> Open WebUI
      - agent_api_net   # Open WebUI -> ADK agent API (internal, key required). Not on agent_net.
    logging: *default-logging
    depends_on:
      - ollama
    restart: unless-stopped

  adk-agent:
    build: ./agent
    image: gforcex-adk-agent:0.1.0
    environment:
      - OLLAMA_API_BASE=http://ollama:11434
      - GFORCEX_MODEL=ollama_chat/llama3.2:3b
      - APPROVED_DOCS_DIR=/data/approved
      - AUDIT_LOG_PATH=/var/log/gforcex/audit.jsonl
      - GFORCEX_AGENT_API_KEY=${GFORCEX_AGENT_API_KEY:?Set GFORCEX_AGENT_API_KEY in .env (see README step 2)}
    volumes:
      # Least privilege: only the approved document is mounted, read-only.
      # unapproved_policy.txt is never visible to the agent.
      - ./approved_class_notes.txt:/data/approved/approved_class_notes.txt:ro
      # Audit log (Control 2). Writable volume; the rest of the container stays read-only.
      - agent_audit:/var/log/gforcex
    # No "ports:" — the agent API is reachable only on the internal Docker network.
    networks:
      - agent_net       # internal: agent -> Ollama, no internet
      - agent_api_net   # internal: Open WebUI -> agent API only
    logging: *default-logging
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    depends_on:
      - ollama
    restart: unless-stopped

# Firewall segmentation (Control 1). See docs/network-firewall.md.
networks:
  edge_net: {}     # proxy <-> Open WebUI (not internal: Docker needs it to publish the proxy's ports)
  webui_net: {}
  agent_net:
    internal: true   # Docker blocks all traffic between this network and the outside world
  agent_api_net:
    internal: true   # Open WebUI <-> ADK agent only; no internet, no proxy, no Ollama

volumes:
  ollama_data:
  webui_data:
  agent_audit:
  caddy_data:
