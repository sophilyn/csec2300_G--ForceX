services:
  ollama:
    image: ollama/ollama:0.40.14
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped

  open-webui:
    image: ghcr.io/open-webui/open-webui:v0.12.5
    ports:
      - "127.0.0.1:3000:8080"
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
      - WEBUI_SECRET_KEY=${WEBUI_SECRET_KEY}
    volumes:
      - webui_data:/app/backend/data
    depends_on:
      - ollama
    restart: unless-stopped

  adk-agent:
    build: ./agent
    image: gforcex-adk-agent:0.1.0
    environment:
      - OLLAMA_API_BASE=http://ollama:11434
      - GFORCEX_MODEL=ollama_chat/llama3.2:3b
      - APPROVED_DOCS_DIR=/data/approved
    volumes:
      # Least privilege: only the approved document is mounted, read-only.
      # unapproved_policy.txt is never visible to the agent.
      - ./approved_class_notes.txt:/data/approved/approved_class_notes.txt:ro
    # DEMO ONLY (do not merge): exposes the agent API on the host to prove CI blocks it.
    ports:
      - "127.0.0.1:8000:8000"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    depends_on:
      - ollama
    restart: unless-stopped

volumes:
  ollama_data:
  webui_data:
